<title>Hoops at Home</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f3f4f8;--card:#fff;--line:#e6e9ef;--tx:#111418;--mut:#5d6674;--ac:#f26b1d;--acx:#fff;--ok:#1f9d55;--sick:#e0a000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0e12;--card:#171a21;--line:#262b35;--tx:#f1f3f6;--mut:#98a2b3;--ok:#3ddc84;--sick:#ffc233}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0e12;--card:#171a21;--line:#262b35;--tx:#f1f3f6;--mut:#98a2b3;--ok:#3ddc84;--sick:#ffc233}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
main{max-width:680px;margin:0 auto;padding:12px 16px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px}h1{font-size:22px;margin:0;letter-spacing:-.3px}h1 span{color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.card h3{margin:0 0 2px;font-size:20px}.card h4{margin:14px 0 4px;font-size:16px;color:var(--ac)}
.sub{color:var(--mut);font-size:14px;margin:0}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.wn{display:flex;align-items:center;justify-content:space-between;gap:8px}.wn b{font-size:18px}
.nb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px}
.dots{display:flex;justify-content:space-between;margin-top:10px}
.dg{background:none;border:0;text-align:center;font-size:11px;color:var(--mut);padding:0}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--ac);color:var(--ac);font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:13px;position:relative}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}.dot.sick{background:var(--sick);border-color:var(--sick);color:#111}
.dot.pr::after{content:"🏀";position:absolute;right:-6px;top:-8px;font-size:12px}
.dg.on .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tx)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:2px solid var(--ac)}
.legend .o{background:var(--ok);border-color:var(--ok)}.legend .s{background:var(--sick);border-color:var(--sick)}
.xc{border-top:1px solid var(--line)}.xh{display:flex;align-items:center;gap:10px;padding:10px 0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;font-size:14px;padding:0}
.xc.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.xi{flex:1;cursor:pointer}.xi b{display:block}.xi span{color:var(--mut);font-size:14px}
.xc.ok .xi b{text-decoration:line-through;color:var(--mut)}
.ar{color:var(--mut);cursor:pointer;padding:6px}.xc.open .ar{transform:rotate(180deg)}
.xd{display:none;padding:0 0 12px 40px;font-size:14px}.xc.open .xd{display:block}
.xd p{margin:0 0 8px;color:var(--mut)}
.yt{display:inline-block;background:#e62117;color:#fff;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600}
.bonus b::after{content:" ★";color:var(--ac)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
select,input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical;margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.flex{display:flex;gap:8px;align-items:center}
.warn{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
.warn.s{background:color-mix(in srgb,var(--sick) 20%,transparent)}
.act{display:flex;gap:10px;margin-top:14px}
.cbtn{flex:2;padding:15px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-weight:800;font-size:16px;letter-spacing:.05em}
.sbtn{flex:1;padding:15px 8px;border-radius:12px;border:1px solid var(--sick);background:none;color:var(--sick);font-weight:700;font-size:14px}
.stt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--ok);border-radius:12px;padding:12px;margin-top:10px;font-weight:600}.stt.s{border-color:var(--sick)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line);padding:0}.sw.on{box-shadow:0 0 0 3px var(--tx)}
input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
.st{flex:none;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;font-size:13px;font-weight:600}.st.s3{background:var(--ok);color:#fff;border-color:var(--ok)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.th img{width:100%;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.th a,.th .f{display:flex;align-items:center;justify-content:center;height:150px;border-radius:10px;border:1px solid var(--line);font-size:13px;text-align:center;padding:6px;color:var(--tx);word-break:break-all;background:var(--bg);text-decoration:none}
.stat{display:flex;gap:8px;margin-top:10px}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{font-size:26px;display:block;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal small{text-align:center;color:var(--mut);font-size:12px}
.cc{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);position:relative;font-weight:600;font-size:14px;padding:0}
.cc.done{background:var(--ok);color:#fff;border-color:var(--ok)}.cc.sick{background:var(--sick);color:#111;border-color:var(--sick)}.cc.td{box-shadow:0 0 0 2px var(--ac)}
.cc.pr::after{content:"🏀";position:absolute;right:1px;top:-1px;font-size:11px}
.wh{display:flex;align-items:center;gap:8px;margin-top:8px}.wh .m{display:flex;gap:4px;flex:1}.wh .m i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.wh .m i.d{background:var(--ok);border-color:var(--ok)}.wh .m i.s{background:var(--sick);border-color:var(--sick)}
#bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
#tm{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:8px 12px}
#tm .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac);min-width:56px}#tm .l{flex:1;font-size:12px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tm .chip{padding:6px 10px;font-size:13px}
#nav{max-width:680px;margin:0 auto;display:flex;border-top:1px solid var(--line)}

.pfh{position:relative;height:360px;border-radius:24px;overflow:hidden;margin-top:6px;background:var(--ph,color-mix(in srgb,var(--pm) 30%,var(--card)))}
.pfh::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-60px;height:150px;background:var(--bg);transform:rotate(-7deg)}
.pfh svg{position:absolute;shape-rendering:geometricPrecision;left:50%;top:14px;height:300px;transform:translateX(-50%);filter:drop-shadow(0 10px 10px rgba(0,0,0,.2));z-index:1}
.pfi{position:absolute;left:16px;bottom:14px;z-index:2}.pfi small{display:block;font-size:17px}.pfi b{display:block;font-size:34px;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:-1px}
.pfb{position:absolute;right:16px;bottom:18px;z-index:2;width:62px;height:62px;border-radius:50%;background:var(--card);box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:20px}.pfb span{font-size:10px;color:var(--mut)}
.pft{position:absolute;top:10px;right:10px;z-index:2;display:flex;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:99px;padding:3px}.pft button{border:0;background:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}.pft .on{background:var(--ac);color:var(--acx)}
.pcol{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pcol label{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600}
.jp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.jp i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.card,.banner{border:0;box-shadow:0 4px 18px rgba(20,30,60,.07);border-radius:22px}
h2{margin:22px 4px 8px}.chip{border:0;background:var(--card);box-shadow:0 1px 4px rgba(20,30,60,.08)}.chip.on{box-shadow:none}
.stt.big{background:color-mix(in srgb,var(--ok) 13%,var(--card));border:0;border-radius:22px;padding:18px;font-size:19px;font-weight:800}.stt.big.s{background:color-mix(in srgb,var(--sick) 18%,var(--card))}
.stt.big small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:3px}.tick{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;align-items:center;justify-content:center;margin-right:10px;font-size:16px}
#nav button.on span{background:color-mix(in srgb,var(--ac) 18%,transparent);border-radius:14px;padding:2px 14px;margin:0 auto 2px;width:fit-content}
.wheel{position:relative;display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px calc(50% - 46px) 6px}.wheel::-webkit-scrollbar{display:none}
.wb{flex:none;width:92px;scroll-snap-align:center;border:0;background:none;text-align:center;padding:0}.wb span{display:flex;width:68px;height:68px;margin:0 auto 4px;border-radius:50%;background:var(--bg);align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 12px rgba(20,30,60,.1)}.wb.on span{background:var(--ac);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 50%,transparent)}.wb small{font-size:11px;font-weight:700;color:var(--mut)}.wb.on small{color:var(--tx)}
.bi{width:100%;border:0;background:none;text-align:center;font-size:22px;font-weight:800;color:var(--ac);padding:0}
.ab{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;font-weight:600}.ab em{width:62px;font-style:normal;color:var(--mut)}.ab span{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.ab i{display:block;height:100%;background:var(--ac);border-radius:9px}.ab b{width:58px;text-align:right}.ab small{color:var(--ok);margin-left:4px}
</style>
</head>

<div class="card"><input type="text" data-pfi="name" maxlength="22" placeholder="Type your name" value="${pe(f.name)}"><h4 style="margin-bottom:0">Position</h4>${wheel()}<p class="sub" style="text-align:center">${(P[S.pos]||P.sf)[1]}</p></div>
<div class="stat">${[["age","Age","31"],["ht","Height","6’0”"],["wt","Weight","lb"]].map(([k,n,p])=>`<div><input type="text" class="bi" data-pfi="${k}" placeholder="${p}" value="${pe(f[k]||"")}"><span>${n}</span></div>`).join("")}</div>
<div class="stat"><div><b>${stk()}</b><span>day streak</span></div><div><b>${done}</b><span>workouts</span></div><div><b>${ov}</b><span>overall</span></div></div>
<div class="card"><b>Your build</b><p class="sub">Grows as you complete workouts. Dashed = day one.</p><svg viewBox="0 0 260 224" style="width:100%">${pradar(at,base)}</svg>
${Object.entries(at).map(([k,v])=>`<div class="ab"><em>${k}</em><span><i style="width:${v}%"></i></span><b>${v}<small>+${v-30}</small></b></div>`).join("")}</div>
<div class="card"><b>Last 7 days</b><div class="dots">${last.map(d=>{const v=S.st[iso(d)];return `<div class="dg"><div class="dot ${v=="done"?"done":v=="sick"?"sick":""}" style="${v?"":"border-color:var(--line);color:var(--mut)"}">${v=="done"?"✓":v=="sick"?"•":""}</div>${D[(d.getDay()+6)%7]}</div>`}).join("")}</div></div>
<div class="card"><b>Jersey</b><div class="pcol"><label><input type="color" data-pfi="maj" value="${f.maj}"> Major</label><label><input type="color" data-pfi="min" value="${f.min}"> Minor</label><label><input type="color" data-pfi="nc" value="${f.nc}"> Number color</label></div><div class="flex" style="margin-top:12px;justify-content:space-between"><b>Jersey number</b><div class="flex"><button class="nb" data-pfn="-1" aria-label="Number down">−</button><input type="number" data-pfi="num" min="0" max="99" inputmode="numeric" value="${f.num}" style="width:76px;text-align:center;font-size:24px;font-weight:900;padding:6px"><button class="nb" data-pfn="1" aria-label="Number up">+</button></div></div>
<div class="jp">${JP.map((c,i)=>`<i data-pfp="${i}" style="background:linear-gradient(135deg,${c[0]} 50%,${c[1]} 50%)"></i>`).join("")}</div>
<div class="flex" style="margin-top:12px;justify-content:space-between"><b>Silhouette</b><div class="row" style="padding:0">${[["#111418","Black"],["#ffffff","White"]].map(([v,n])=>`<button class="chip ${f.sil==v?"on":""}" data-pfs="${v}">${n}</button>`).join("")}</div></div>
<div class="flex" style="margin-top:12px;justify-content:space-between"><b>Name on back</b><button class="chip ${f.nm?"on":""}" data-pfnm>${f.nm?"On":"Off"}</button></div></div>`}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.pfi;if(!k)return;S.pf=PF();S.pf[k]=k=="num"?Math.max(0,Math.min(99,+e.target.value||0)):e.target.value;save();const h=document.getElementById("pfh");if(h)h.innerHTML=phero()});
document.addEventListener("click",e=>{const t=e.target.closest("[data-pfv],[data-pfp],[data-pfs],[data-pfnm],[data-pfn]");if(!t)return;S.pf=PF();const x=t.dataset;if("pfv"in x){S.pf.back=+x.pfv}else if("pfp"in x){[S.pf.maj,S.pf.min,S.pf.nc]=JP[+x.pfp]}else if("pfs"in x){S.pf.sil=x.pfs}else if("pfn"in x){S.pf.num=(+S.pf.num+ +x.pfn+100)%100}else{S.pf.nm=S.pf.nm?0:1}save();render()});
function render(){look();
document.getElementById("cfg").innerHTML=cfg?`<div class="card"><b>Accent color</b><div class="row wrap" style="margin:10px 0">${PRE.map(c=>`<button class="sw ${S.ac==c?"on":""}" style="background:${c}" data-ac="${c}" aria-label="${c}"></button>`).join("")}<input type="color" value="${S.ac}" data-cc aria-label="Custom color"></div><b>Theme</b><div class="row" style="margin-top:8px">${[["","Auto"],["light","Light"],["dark","Dark"]].map(([v,n])=>`<button class="chip ${S.theme==v?"on":""}" data-th="${v}">${n}</button>`).join("")}</div></div>`:"";
document.getElementById("nav").innerHTML=[["week","📅","Week"],["cal","🗓️","Calendar"],["lab","🎯","Lab"],["book","📋","Playbook"],["prog","📈","Progress"],["me","👤","Me"]].map(([k,i,n])=>`<button class="${S.tab==k?"on":""}" data-tab="${k}"><span>${i}</span>${n}</button>`).join("");
document.getElementById("panel").innerHTML={week,cal,lab,book:()=>`<h2 style="margin-top:6px">Playbook</h2>`+playbook(),prog,me:profile}[S.tab]();wheelInit();
document.querySelectorAll("[data-fid]").forEach(el=>{const id=el.dataset.fid,ap=u=>el.tagName=="IMG"?el.src=u:el.href=u;if(U[id])return ap(U[id]);idb("get",id).then(r=>{if(r){U[id]=URL.createObjectURL(r.b);ap(U[id])}}).catch(()=>{})})}
let T=0,tid;const tt=document.getElementById("tt"),tl=document.getElementById("tl");
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function startT(s,l){clearInterval(tid);T=s;tt.textContent=fmt(T);tl.textContent=l||"Rest";tid=setInterval(()=>{T--;tt.textContent=fmt(Math.max(T,0));if(T<=0){clearInterval(tid);tl.textContent="Done! Go.";try{navigator.vibrate&&navigator.vibrate([200,100,200]);const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}}},1000)}
function compress(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>r(b||f),"image/jpeg",.85)};im.onerror=()=>r(f);im.src=u})}
const curIso=()=>iso(addD(MON,wo*7+S.di));
document.addEventListener("click",e=>{const t=e.target.closest("[data-pos],[data-di],[data-wo],[data-cm],[data-cd],[data-md],[data-fin],[data-un],[data-k],[data-o],[data-tab],[data-sk],[data-addplay],[data-rm],[data-st],[data-ac],[data-th],[data-t],[data-up],[data-view],[data-bm],[data-jr],[data-jd],#gear,#ov");if(!t)return;const x=t.dataset;
if(t.id=="ov"){t.style.display="none";return}
if(t.id=="gear")cfg=!cfg;
else if(x.t){startT(+x.t,x.tl||x.t+" sec rest");return}
else if("view"in x){const o=document.getElementById("ov");o.querySelector("img").src=t.src;o.style.display="flex";return}
else if(x.up){addTo=+x.up;document.getElementById("fi").click();return}
else if(x.o)OP[x.o]=!OP[x.o];
else if(x.k){S.done[x.k]=!S.done[x.k];if(S.done[x.k])S.log[curIso()]=1}
else if(x.di)S.di=+x.di;
else if(x.wo)wo=x.wo=="0"?0:wo+ +x.wo;
else if(x.cm)cm+=+x.cm;
else if(x.cd){const dt=new Date(x.cd+"T12:00:00");wo=Math.round((addD(dt,-((dt.getDay()+6)%7))-MON)/6048e5);S.di=(dt.getDay()+6)%7;S.tab="week";scrollTo(0,0)}
else if(x.md)S.md[curIso()]=x.md;
else if(x.fin){S.st[curIso()]=x.fin;S.log[curIso()]=1}
else if("un"in x)delete S.st[curIso()];
else if(x.pos)S.pos=x.pos;
else if(x.tab)S.tab=x.tab;
else if(x.ac)S.ac=x.ac;
else if("th"in x)S.theme=x.th;
else if(x.sk){const d=D[S.di],a=(S.sk[d]||DEF[d]).slice(),n=a.indexOf(x.sk);n>=0?a.splice(n,1):a.push(x.sk);S.sk[d]=a}
else if("addplay"in x){const v=document.getElementById("np").value.trim();if(v)S.plays.push({n:v,s:0,f:[],t:""})}
else if(x.rm){const p=S.plays.splice(+x.rm,1)[0];(p.f||[]).forEach(f=>idb("delete",f.id).catch(()=>{}))}
else if(x.st){const p=S.plays[+x.st];p.s=(p.s+1)%4}
else if(x.bm){const v=parseFloat(document.getElementById("bm"+x.bm).value);if(isNaN(v))return;(S.bm[x.bm]=S.bm[x.bm]||[]).push({d:TD,v})}
else if("jr"in x){const g=i=>document.getElementById(i).value.trim();S.jr.push({d:TD,o:g("jo"),r:g("jr"),w:g("jw"),f:g("jf")})}
else if(x.jd)S.jr.splice(+x.jd,1);
save();render()});
document.getElementById("fi").addEventListener("change",async e=>{const p=S.plays[addTo];if(!p)return;p.f=p.f||[];try{for(const f of e.target.files){const isI=f.type.startsWith("image"),b=isI?await compress(f):f,id="f"+Date.now()+Math.random().toString(36).slice(2,6);await idb("put",{b},id);p.f.push({id,n:f.name,t:isI?"image/jpeg":f.type||"file"})}}catch(x){alert("Couldn’t save that file in this browser.")}e.target.value="";save();render()});
document.addEventListener("change",e=>{const t=e.target,x=t.dataset;
if(x.prac)S.prac[x.prac]=Object.assign(S.prac[x.prac]||{when:"After school"},{on:t.checked});
else if(x.when)S.prac[x.when].when=t.value;
else return;save();render()});
document.addEventListener("input",e=>{const t=e.target,x=t.dataset;
if(x.note){S.notes[x.note]=t.value;save()}
else if(x.pn){S.plays[+x.pn].t=t.value;save()}
else if(x.ptime){S.prac[x.ptime].time=t.value;save()}
else if("cc"in x){S.ac=t.value;save();look()}});
render();
</script>
</body>
</html>
